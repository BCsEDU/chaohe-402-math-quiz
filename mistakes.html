<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>康軒四上數學｜學生錯題紀錄與類題練習網</title>
<style>
  :root {
    --bg: #edf5f0;
    --surface: #ffffff;
    --surface-sub: #f5faf7;
    --primary: #1f6351;
    --primary-hover: #175243;
    --primary-mid: #24745f;
    --primary-light: #d8f0e7;
    --primary-soft: #ebf7f2;
    --accent: #c96f16;
    --teal: #0f766e;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --success: #16a34a;
    --success-light: #dcfce7;
    --text: #162b24;
    --text-muted: #48635a;
    --text-subtle: #5d786f;
    --border: #c4d6ce;
    --border-soft: #dce8e2;
    --font-scale: 1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* 頂部導覽列（與 index.html 統一風格） */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1b4d3e;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    box-shadow: 0 4px 12px rgba(22, 43, 36, 0.16);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    text-decoration: none;
    color: inherit;
  }

  .brand-badge {
    background: #fbbf24;
    color: #1b4d3e;
    font-weight: 900;
    font-size: 1.15rem;
    padding: 4px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .brand-title {
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 0.4px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    white-space: nowrap;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }

  .tool-btn.active {
    background: #fbbf24;
    color: #1b4d3e;
    border-color: #fbbf24;
  }

  .tool-btn.teacher-link {
    background: rgba(251, 191, 36, 0.18);
    border-color: rgba(251, 191, 36, 0.65);
    color: #fef3c7;
  }

  /* 主容器 */
  main {
    max-width: 1480px;
    margin: 0 auto;
    padding: 24px 24px 64px;
  }

  /* 首頁：康軒四上數學目次畫面 */
  .hero-banner {
    background: linear-gradient(135deg, #1b4d3e 0%, #175243 60%, #2e8b72 100%);
    color: #fff;
    border-radius: 24px;
    padding: 28px 36px;
    margin-bottom: 28px;
    box-shadow: 0 12px 28px rgba(27, 77, 62, 0.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .hero-banner h1 {
    font-size: calc(2.15rem * var(--font-scale));
    font-weight: 900;
    margin-bottom: 6px;
    line-height: 1.25;
  }

  .hero-banner p {
    font-size: calc(1.22rem * var(--font-scale));
    color: #d8f0e7;
    font-weight: 600;
  }

  .stats-summary {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: rgba(255, 255, 255, 0.14);
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 12px 20px;
    text-align: center;
    min-width: 130px;
  }

  .stat-num {
    font-size: 1.9rem;
    font-weight: 900;
    color: #fbbf24;
    line-height: 1.1;
  }

  .stat-label {
    font-size: 0.95rem;
    font-weight: 700;
    color: #d8f0e7;
    margin-top: 4px;
  }

  /* 康軒目次紅十字手風琴列表（還原截圖目次風格＋護眼深松青綠主題） */
  .toc-container {
    background: var(--surface);
    border-radius: 24px;
    border: 3px solid var(--border);
    box-shadow: 0 10px 26px rgba(22, 43, 36, 0.06);
    overflow: hidden;
  }

  .toc-header-bar {
    background: var(--surface-sub);
    padding: 18px 28px;
    border-bottom: 2px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .toc-header-title {
    font-size: calc(1.45rem * var(--font-scale));
    font-weight: 900;
    color: #1b4d3e;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .unit-item {
    border-bottom: 2px dotted #9bb5aa;
  }

  .unit-item:last-child {
    border-bottom: none;
  }

  .unit-row {
    padding: 22px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
    transition: background 0.15s ease;
    user-select: none;
  }

  .unit-row:hover {
    background: var(--primary-soft);
  }

  .unit-row.active-unit {
    background: var(--primary-light);
  }

  .unit-left {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
  }

  /* 還原圖片中的紅框十字按鈕 */
  .red-plus-box {
    width: 40px;
    height: 40px;
    border: 3px solid #ef4444;
    border-radius: 6px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .red-plus-box::before,
  .red-plus-box::after {
    content: "";
    position: absolute;
    background: #ef4444;
    border-radius: 2px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .red-plus-box::before {
    width: 22px;
    height: 6px;
  }

  .red-plus-box::after {
    width: 6px;
    height: 22px;
  }

  .unit-item.expanded .red-plus-box {
    background: #fef2f2;
  }

  .unit-item.expanded .red-plus-box::after {
    transform: scaleY(0);
    opacity: 0;
  }

  .unit-title-text {
    font-size: calc(1.95rem * var(--font-scale));
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .unit-badges {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge-pill {
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
  }

  .badge-pill.has-error {
    background: #fee2e2;
    color: #b91c1c;
    border: 2px solid #fca5a5;
  }

  .badge-pill.quiz-ready {
    background: #dcfce7;
    color: #15803d;
    border: 2px solid #86efac;
  }

  .badge-pill.empty {
    background: #eef4f0;
    color: var(--text-muted);
  }

  /* 小節展開清單 */
  .subsections-panel {
    display: none;
    background: var(--surface-sub);
    padding: 12px 28px 24px 86px;
    border-top: 1.5px solid var(--border-soft);
  }

  @media (max-width: 768px) {
    .subsections-panel {
      padding: 12px 16px 20px 16px;
    }
  }

  .unit-item.expanded .subsections-panel {
    display: block;
  }

  /* 第七單元雙向整合快捷卡 */
  .u7-quiz-callout {
    background: linear-gradient(135deg, #ffffff 0%, #ebf7f2 100%);
    border: 2.5px solid var(--primary-mid);
    border-radius: 18px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    box-shadow: 0 6px 16px rgba(31, 99, 81, 0.08);
  }

  .u7-quiz-title {
    font-size: calc(1.22rem * var(--font-scale));
    font-weight: 900;
    color: #1b4d3e;
  }

  .u7-quiz-desc {
    font-size: calc(1rem * var(--font-scale));
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .u7-quiz-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .u7-link-btn {
    padding: 11px 18px;
    border-radius: 12px;
    font-size: calc(1.06rem * var(--font-scale));
    font-weight: 900;
    text-decoration: none;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .u7-link-btn.prac {
    background: #24745f;
  }
  .u7-link-btn.prac:hover {
    background: #175243;
    transform: translateY(-2px);
  }

  .u7-link-btn.exam {
    background: #c96f16;
  }
  .u7-link-btn.exam:hover {
    background: #a85a0f;
    transform: translateY(-2px);
  }

  .sub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr));
    gap: 16px;
    margin-top: 12px;
  }

  .sub-card {
    background: #ffffff;
    border: 2.5px solid var(--border);
    border-radius: 18px;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: all 0.18s ease;
  }

  .sub-card.ready {
    border-color: var(--primary-mid);
    background: linear-gradient(180deg, #ffffff 0%, #ebf7f2 100%);
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(31, 99, 81, 0.12);
  }

  .sub-card.ready:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(31, 99, 81, 0.2);
    border-color: var(--primary-hover);
  }

  .sub-card.locked {
    opacity: 0.74;
    border-style: dashed;
  }

  .sub-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .sub-code {
    background: var(--primary);
    color: #fff;
    font-weight: 900;
    font-size: calc(1.1rem * var(--font-scale));
    padding: 4px 12px;
    border-radius: 999px;
  }

  .sub-card.locked .sub-code {
    background: #7c968c;
  }

  .sub-count {
    font-size: 0.98rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .sub-count.active {
    background: #fef3c7;
    color: #b45309;
    border: 1.5px solid #f59e0b;
  }

  .sub-count.zero {
    background: #eef4f0;
    color: var(--text-subtle);
  }

  .sub-name {
    font-size: calc(1.5rem * var(--font-scale));
    font-weight: 900;
    color: var(--text);
  }

  .sub-desc {
    font-size: calc(1.05rem * var(--font-scale));
    color: var(--text-muted);
    font-weight: 600;
  }

  .sub-action-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }

  .sub-card.ready:hover .sub-action-btn {
    background: var(--primary-hover);
  }

  .sub-card.locked .sub-action-btn {
    background: #dce8e2;
    color: var(--text-subtle);
    cursor: not-allowed;
  }

  /* 錯題檢討與類題練習視圖 */
  #practice-view {
    display: none;
  }

  .nav-panel {
    background: var(--surface);
    border-radius: 20px;
    padding: 16px 24px;
    margin-bottom: 20px;
    border: 2.5px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(22, 43, 36, 0.05);
  }

  .nav-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .breadcrumb-title {
    font-size: calc(1.55rem * var(--font-scale));
    font-weight: 900;
    color: #1b4d3e;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .section-pill {
    background: var(--primary-light);
    color: var(--primary);
    border: 2px solid #8ec9b4;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
  }

  /* 錯題 ➔ 類題 配對進度列 */
  .pair-nav-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  @media (max-width: 900px) {
    .pair-nav-grid {
      grid-template-columns: 1fr;
    }
  }

  .pair-group {
    background: var(--surface-sub);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .pair-group.active-group {
    background: var(--primary-soft);
    border-color: var(--primary-mid);
  }

  .step-tab {
    flex: 1;
    min-width: 0;
    min-height: 46px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #ffffff;
    color: #2b453c;
    font-size: calc(1.08rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 4px 8px;
    transition: all 0.15s;
  }

  .step-tab:hover {
    border-color: var(--primary-mid);
    background: var(--primary-soft);
  }

  .step-tab.current {
    background: var(--primary);
    color: #fff;
    border-color: #1b4d3e;
    box-shadow: 0 4px 10px rgba(27, 77, 62, 0.28);
  }

  .step-tab.type-mistake.current {
    background: #dc2626;
    border-color: #991b1b;
    box-shadow: 0 4px 10px rgba(220, 38, 38, 0.28);
  }

  .step-tab.type-practice.current {
    background: #0f766e;
    border-color: #115e59;
    box-shadow: 0 4px 10px rgba(15, 118, 110, 0.28);
  }

  .step-tab.done-ok {
    background: #dcfce7;
    border-color: #16a34a;
    color: #14532d;
  }

  .step-tab.done-wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #7f1d1d;
  }

  .pair-arrow {
    font-weight: 900;
    color: var(--text-subtle);
    font-size: 1.15rem;
    flex-shrink: 0;
  }

  /* 舞台卡片：專為 iPad 橫向與教室投影最佳化之雙欄設計 */
  .stage-card {
    background: var(--surface);
    border-radius: 26px;
    padding: 28px 32px;
    border: 3px solid #9db8ad;
    box-shadow: 0 14px 32px rgba(22, 43, 36, 0.08);
    margin-bottom: 20px;
    position: relative;
  }

  .stage-card.mode-mistake {
    border-top: 8px solid #dc2626;
  }

  .stage-card.mode-practice {
    border-top: 8px solid #0f766e;
  }

  .stage-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--border-soft);
  }

  .q-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: calc(1.35rem * var(--font-scale));
    font-weight: 900;
    padding: 6px 18px;
    border-radius: 999px;
  }

  .q-type-badge.mistake {
    background: #fee2e2;
    color: #b91c1c;
    border: 2px solid #f87171;
  }

  .q-type-badge.practice {
    background: var(--primary-light);
    color: #0f766e;
    border: 2px solid #5eead4;
  }

  .stage-helper-btns {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .helper-btn {
    background: var(--surface-sub);
    color: var(--text);
    border: 2px solid var(--border);
    padding: 7px 14px;
    border-radius: 12px;
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }

  .helper-btn:hover {
    background: var(--primary-soft);
    border-color: var(--primary-mid);
  }

  .helper-btn.active {
    background: #fef3c7;
    color: #92400e;
    border-color: #f59e0b;
  }

  /* 題目主體雙欄網格（左圖右題，或上下排版） */
  .stage-body-grid {
    display: grid;
    grid-template-columns: minmax(320px, 46%) 1fr;
    gap: 28px;
    align-items: center;
  }

  .stage-body-grid.full-width-layout {
    grid-template-columns: 1fr;
  }

  @media (max-width: 980px) {
    .stage-body-grid {
      grid-template-columns: 1fr;
    }
  }

  /* 幾何圖形展示盒（含手寫畫布疊層） */
  .diagram-panel {
    position: relative;
    background: #ffffff;
    border: 3px solid var(--border);
    border-radius: 22px;
    padding: 18px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 8px rgba(22, 43, 36, 0.04);
    overflow: hidden;
  }

  .diagram-svg-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .diagram-svg-wrap svg {
    width: 100%;
    max-width: 480px;
    height: auto;
    max-height: 350px;
    display: block;
  }

  .orig-img-wrap {
    display: none;
    width: 100%;
    text-align: center;
  }

  .orig-img-wrap.show {
    display: block;
  }

  .orig-img-wrap img {
    max-width: 100%;
    max-height: 360px;
    border-radius: 12px;
    border: 2px solid var(--border-soft);
    object-fit: contain;
  }

  /* 手寫塗鴉 Canvas 疊層 */
  #draw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
    touch-action: none;
  }

  #draw-canvas.drawing-active {
    pointer-events: auto;
    cursor: crosshair;
  }

  .draw-toolbar {
    display: none;
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 30;
    background: rgba(22, 43, 36, 0.9);
    padding: 6px 10px;
    border-radius: 12px;
    gap: 8px;
    align-items: center;
  }

  .draw-toolbar.show {
    display: flex;
  }

  .color-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    cursor: pointer;
    transition: transform 0.12s;
  }

  .color-dot.active {
    transform: scale(1.22);
    box-shadow: 0 0 0 2px #fde047;
  }

  .clear-draw-btn {
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
  }

  /* 右側題幹與選項區 */
  .question-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
  }

  .question-stem {
    font-size: calc(1.95rem * var(--font-scale));
    font-weight: 900;
    color: var(--text);
    line-height: 1.6;
  }

  /* 還原第一題的下拉選單填空互動框 */
  .inline-select-wrap {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin: 4px 6px;
    position: relative;
    max-width: 100%;
  }

  .inline-select {
    appearance: none;
    -webkit-appearance: none;

// ============================================================================
// 3. 狀態管理與 LocalStorage 儲存
// ============================================================================
const CIRCLED_NUMS = ["(1)", "(2)", "(3)", "(4)"];
const STORAGE_KEY = "kanghsuan_4a_math_mistakes_v1";

let currentStepIndex = 0;
let userState = {}; // { [qId]: { selected: number|null, slot1: string, slot2: string, revealed: boolean } }
let fontScale = 1;
let showOrigImage = false;
let isDrawingMode = false;
let penColor = "#ef4444";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) userState = JSON.parse(raw);
  } catch (e) {
    userState = {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
  } catch (e) {}
  updateHomeStats();
}

function clearSavedProgress() {
  userState = {};
  saveProgress();
  renderTOC();
}

function updateHomeStats() {
  let doneCount = 0;
  QUESTIONS_5_2.forEach(q => {
    const st = userState[q.id];
    if (st && (st.selected === q.answer || st.revealed)) {
      doneCount++;
    }
  });
  const el = document.getElementById("stat-mastered-count");
  if (el) el.textContent = `${doneCount} / ${QUESTIONS_5_2.length}`;
}

// ============================================================================
// 4. 首頁目次渲染（還原康軒紅十字目次＋各小節卡片＋第七單元雙向整合）
// ============================================================================
function renderTOC() {
  updateHomeStats();
  const listEl = document.getElementById("toc-list");

  listEl.innerHTML = CURRICULUM.map(unit => {
    const totalMistakes = unit.subsections.reduce((acc, s) => acc + s.mistakeCount, 0);
    const expandedClass = unit.expandedByDefault ? "expanded" : "";

    const u7QuizBanner = unit.hasInteractiveQuiz ? `
      <div class="u7-quiz-callout">
        <div>
          <div class="u7-quiz-title">✨ 第七單元《小數》課堂互動練習與隨堂線上測驗已開放！</div>
          <div class="u7-quiz-desc">含認識二位小數、長度換算、小數比大小（三大題 15 題組，共 45 格）</div>
        </div>
        <div class="u7-quiz-actions">
          <a href="index.html?unit=U7&mode=practice" class="u7-link-btn prac">🖥 課堂互動練習</a>
          <a href="index.html?unit=U7&mode=exam" class="u7-link-btn exam">✍️ 隨堂線上測驗</a>
        </div>
      </div>
    ` : "";

    const subsHtml = unit.subsections.map(sub => {
      const isReady = sub.ready;
      return `
        <div class="sub-card ${isReady ? 'ready' : 'locked'}"
             onclick="${isReady ? `openPracticeUnit('${sub.code}')` : ''}">
          <div>
            <div class="sub-top">
              <span class="sub-code">${sub.code} 小節</span>
              <span class="sub-count ${sub.mistakeCount > 0 ? 'active' : 'zero'}">
                ${sub.mistakeCount > 0 ? `📌 ${sub.mistakeCount} 題錯題＋${sub.mistakeCount} 題類題` : '尚無錯題紀錄'}
              </span>
            </div>
            <div class="sub-name" style="margin-top:12px;">${sub.title}</div>
            <div class="sub-desc" style="margin-top:6px;">${sub.desc}</div>
          </div>
          <button class="sub-action-btn" ${isReady ? '' : 'disabled'}>
            ${isReady ? '▶ 進入錯題檢討與類題練習' : '⏳ 尚無錯題'}
          </button>
        </div>
      `;
    }).join("");

    return `
      <div class="unit-item ${expandedClass}" id="unit-${unit.unitId}">
        <div class="unit-row" onclick="toggleUnitExpand('${unit.unitId}')">
          <div class="unit-left">
            <div class="red-plus-box"></div>
            <span class="unit-title-text">${unit.unitTitle}</span>
          </div>
          <div class="unit-badges">
            ${unit.hasInteractiveQuiz ? `<span class="badge-pill quiz-ready">✨ 隨堂練習／測驗已開放</span>` : ""}
            <span class="badge-pill ${totalMistakes > 0 ? 'has-error' : 'empty'}">
              ${totalMistakes > 0 ? `🔥 待複習錯題：${totalMistakes} 題（含類題共 ${totalMistakes * 2} 題）` : `共 ${unit.subsections.length} 個小節`}
            </span>
          </div>
        </div>
        <div class="subsections-panel">
          ${u7QuizBanner}
          <div style="font-size:1.05rem;font-weight:800;color:#48635a;">
            請選擇小節（共分為 ${unit.subsections.length} 個小節）：
          </div>
          <div class="sub-grid">
            ${subsHtml}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function toggleUnitExpand(unitId) {
  const el = document.getElementById(`unit-${unitId}`);
  if (el) el.classList.toggle("expanded");
}

function openPracticeUnit(subCode) {
  if (subCode !== "5-2") return;
  currentStepIndex = 0;
  showOrigImage = false;
  document.getElementById("home-view").style.display = "none";
  document.getElementById("practice-view").style.display = "block";
  renderPracticeStage();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  document.getElementById("home-view").style.display = "block";
  document.getElementById("practice-view").style.display = "none";
  renderTOC();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 6. 練習舞台渲染與互動邏輯

function renderPairNav() {
  const navEl = document.getElementById("pair-nav-grid");
  const pairs = [
    { idx: 1, m: QUESTIONS_5_2[0], p: QUESTIONS_5_2[1] },
    { idx: 2, m: QUESTIONS_5_2[2], p: QUESTIONS_5_2[3] },
    { idx: 3, m: QUESTIONS_5_2[4], p: QUESTIONS_5_2[5] }
  ];

  navEl.innerHTML = pairs.map((pair, pIdx) => {
    const mGlobalIdx = pIdx * 2;
    const pGlobalIdx = pIdx * 2 + 1;
    const isGroupActive = (currentStepIndex === mGlobalIdx || currentStepIndex === pGlobalIdx);

    const getTabClass = (q, gIdx) => {
      let cls = `step-tab ${q.type === 'mistake' ? 'type-mistake' : 'type-practice'}`;
      if (currentStepIndex === gIdx) cls += " current";
      else {
        const st = userState[q.id];
        if (st && (st.selected === q.answer || st.revealed)) cls += " done-ok";
        else if (st && st.selected !== null && st.selected !== q.answer) cls += " done-wrong";
      }
      return cls;
    };

    return `
      <div class="pair-group ${isGroupActive ? 'active-group' : ''}">
        <button class="${getTabClass(pair.m, mGlobalIdx)}" onclick="jumpToStep(${mGlobalIdx})">
          <span>⚠️ 錯題 ${pair.idx}</span>
        </button>
        <span class="pair-arrow">➔</span>
        <button class="${getTabClass(pair.p, pGlobalIdx)}" onclick="jumpToStep(${pGlobalIdx})">
          <span>🎯 類題 ${pair.idx}</span>
        </button>
      </div>
    `;
  }).join("");
}

function renderPracticeStage() {
  const q = QUESTIONS_5_2[currentStepIndex];
  const st = userState[q.id] || { selected: null, slot1: "請選擇角", slot2: "請選擇三角形", revealed: false };

  renderPairNav();
  clearCanvas();

  // 設定卡片頂部邊框顏色（錯題紅、類題深青綠）
  const stageCard = document.getElementById("stage-card");
  stageCard.className = `stage-card ${q.type === 'mistake' ? 'mode-mistake' : 'mode-practice'}`;

  // 題型徽章
  document.getElementById("stage-badge-wrap").innerHTML = `
    <span class="q-type-badge ${q.type}">
      ${q.badgeText}
    </span>
  `;

  // 原圖切換按鈕（僅錯題 1~3 有原題截圖）
  const btnOrig = document.getElementById("btn-toggle-orig");
  if (q.origImg) {
    btnOrig.style.display = "inline-flex";
    btnOrig.classList.toggle("active", showOrigImage);
    btnOrig.textContent = showOrigImage ? "📐 切回互動向量圖" : "🖼️ 對照原題截圖";
    document.getElementById("orig-img-el").src = q.origImg;
  } else {
    btnOrig.style.display = "none";
    showOrigImage = false;
  }

  // 類題隨機出題按鈕
  const btnRandom = document.getElementById("btn-random-practice");
  btnRandom.style.display = (q.type === "practice") ? "inline-flex" : "none";

  const isCorrectOrRevealed = (st.selected === q.answer) || st.revealed;

  // 判斷版面：第 3 組（visual-cards）使用滿版雙圖卡，第 1、2 組使用左圖右題
  const bodyGrid = document.getElementById("stage-body-grid");
  const diagPanel = document.getElementById("diagram-panel");
  const stemEl = document.getElementById("stage-stem");
  const hintEl = document.getElementById("options-hint");
  const optsWrap = document.getElementById("stage-options-wrap");

  if (q.layoutType === "visual-cards") {
    bodyGrid.className = "stage-body-grid full-width-layout";
    diagPanel.style.display = showOrigImage ? "flex" : "none";
    if (showOrigImage) {
      document.getElementById("diagram-svg-wrap").style.display = "none";
      document.getElementById("orig-img-wrap").className = "orig-img-wrap show";
    }

    stemEl.innerHTML = q.stem;
    hintEl.textContent = "👇 請直接點選正確的三角形圖卡：";

    optsWrap.innerHTML = `
      <div class="visual-choice-grid">
        ${q.visualCards.map((card, idx) => {
          let cls = "visual-card-btn";
          if (st.revealed) {
            if (idx === q.answer) cls += " correct";
            else if (st.selected === idx) cls += " wrong";
          }
          const highlightThisCard = isCorrectOrRevealed && (idx === q.answer);
          return `
            <div class="${cls}" onclick="selectOption(${idx})">
              <div class="visual-card-header">
                <span class="visual-card-label">${card.num} 三角形 ${card.name}</span>
                <span style="font-size:1.2rem;font-weight:900;color:#48635a;">點擊選我</span>
              </div>
              <div class="visual-card-svg">
                ${renderVisualCardSVG(card, highlightThisCard)}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  } else {
    bodyGrid.className = "stage-body-grid";
    diagPanel.style.display = "flex";

    if (showOrigImage && q.origImg) {
      document.getElementById("diagram-svg-wrap").style.display = "none";
      document.getElementById("orig-img-wrap").className = "orig-img-wrap show";
    } else {
      document.getElementById("diagram-svg-wrap").style.display = "flex";
      document.getElementById("orig-img-wrap").className = "orig-img-wrap";
      document.getElementById("diagram-svg-wrap").innerHTML = renderDiagramSVG(q, isCorrectOrRevealed);
    }

    if (q.layoutType === "dual-select") {
      let slot1Cls = "inline-select";
      let slot2Cls = "inline-select";
      if (st.revealed) {
        slot1Cls += (st.slot1 === q.correctSlot1) ? " correct-slot" : " wrong-slot";
        slot2Cls += (st.slot2 === q.correctSlot2) ? " correct-slot" : " wrong-slot";
      }

      const s1Opts = q.slot1Options.map(o => `<option value="${o}" ${st.slot1 === o ? 'selected' : ''}>${o}</option>`).join("");
      const s2Opts = q.slot2Options.map(o => `<option value="${o}" ${st.slot2 === o ? 'selected' : ''}>${o}</option>`).join("");

      stemEl.innerHTML = `
        ${q.stemPrefix}
        <span class="inline-select-wrap">
          <select class="${slot1Cls}" onchange="onInlineSlotChange(1, this.value)">${s1Opts}</select>
          <span class="inline-select-arrow">▾</span>
        </span>
        ${q.stemMiddle}
        <span class="inline-select-wrap">
          <select class="${slot2Cls}" onchange="onInlineSlotChange(2, this.value)">${s2Opts}</select>
          <span class="inline-select-arrow">▾</span>
        </span>
        ${q.stemSuffix}
      `;
      hintEl.textContent = "💡 可直接點選上方空格下拉選單，或點擊下方組合快速作答：";
    } else {
      stemEl.innerHTML = q.stem;
      hintEl.textContent = "👇 請選擇正確答案：";
    }

    optsWrap.innerHTML = `
      <div class="options-grid ${q.options.some(o => o.length > 12) ? 'single-col' : ''}">
        ${q.options.map((optText, idx) => {
          let cls = "option-btn";
          if (st.revealed) {
            if (idx === q.answer) cls += " correct";
            else if (st.selected === idx) cls += " wrong";
          }
          return `
            <button class="${cls}" onclick="selectOption(${idx})">
              <span class="opt-index">${CIRCLED_NUMS[idx]}</span>
              <span>${optText}</span>
            </button>
          `;
        }).join("")}
      </div>
    `;
  }

  // 診斷詳解與「挑戰類題」按鈕區
  const expBox = document.getElementById("stage-exp");
  if (st.revealed) {
    expBox.classList.add("show");
    const isCorrect = (st.selected === q.answer);
    const titleEl = document.getElementById("stage-exp-title");

    if (st.selected === null) {
      titleEl.innerHTML = `💡 觀念解析｜正確答案：${CIRCLED_NUMS[q.answer]} ${q.options[q.answer]}`;
      titleEl.style.color = "#b45309";
    } else if (isCorrect) {
      titleEl.innerHTML = `🎉 答對了！正確答案是 ${CIRCLED_NUMS[q.answer]} ${q.options[q.answer]}`;
      titleEl.style.color = "#15803d";
    } else {
      titleEl.innerHTML = `❌ 答錯囉！正確答案是 ${CIRCLED_NUMS[q.answer]} ${q.options[q.answer]}`;
      titleEl.style.color = "#dc2626";
    }

    document.getElementById("stage-pitfall").innerHTML = `<b>🔍 迷思診斷：</b>${q.pitfall}`;
    document.getElementById("stage-concept").innerHTML = q.concept;

    const actionsEl = document.getElementById("stage-exp-actions");
    if (q.type === "mistake") {
      actionsEl.innerHTML = `
        <button class="go-similar-btn" onclick="nextStep()">
          <span>🎯 檢討完了！立即練習【類題 ${q.pairIndex}】</span>
          <span>➔</span>
        </button>
      `;
    } else {
      const hasNextMistake = currentStepIndex < QUESTIONS_5_2.length - 1;
      actionsEl.innerHTML = `
        <button class="ctrl-btn random-gen" onclick="generateNewNumbersForPractice()">
          🎲 換一組數字再練一次
        </button>
        ${hasNextMistake ? `
          <button class="go-similar-btn" onclick="nextStep()">
            <span>✅ 類題過關！前往【錯題 ${q.pairIndex + 1}】</span>
            <span>➔</span>
          </button>
        ` : `
          <button class="go-similar-btn" onclick="goHome()">
            <span>🏆 恭喜完成 5-2 全部錯題與類題！返回目次</span>
          </button>
        `}
      `;
    }
  } else {
    expBox.classList.remove("show");
  }

  document.getElementById("btn-prev").disabled = (currentStepIndex === 0);
  document.getElementById("btn-next").disabled = (currentStepIndex === QUESTIONS_5_2.length - 1);

  setTimeout(resizeCanvas, 30);
}

// 當學生使用第一題題幹中的下拉選單作答時
function onInlineSlotChange(slotNum, val) {
  const q = QUESTIONS_5_2[currentStepIndex];
  const st = userState[q.id] || { selected: null, slot1: "請選擇角", slot2: "請選擇三角形", revealed: false };
  if (slotNum === 1) st.slot1 = val;
  if (slotNum === 2) st.slot2 = val;

  if (st.slot1 !== "請選擇角" && st.slot2 !== "請選擇三角形") {
    const combined = `${st.slot1} ／ ${st.slot2}`;
    const matchedIdx = q.options.findIndex(o => o === combined);
    if (matchedIdx !== -1) {
      st.selected = matchedIdx;
    } else {
      st.selected = (st.slot1 === q.correctSlot1 && st.slot2 === q.correctSlot2) ? q.answer : -1;
    }
    st.revealed = true;
  }
  userState[q.id] = st;
  saveProgress();
  renderPracticeStage();
}

function selectOption(optIdx) {
  const q = QUESTIONS_5_2[currentStepIndex];
  let slot1 = "請選擇角";
  let slot2 = "請選擇三角形";
  if (q.layoutType === "dual-select") {
    const parts = q.options[optIdx].split(" ／ ");
    slot1 = parts[0];
    slot2 = parts[1];
  }
  userState[q.id] = {
    selected: optIdx,
    slot1,
    slot2,
    revealed: true
  };
  saveProgress();
  renderPracticeStage();
}

function revealCurrentAnswer() {
  const q = QUESTIONS_5_2[currentStepIndex];
  const cur = userState[q.id] || { selected: null, slot1: "請選擇角", slot2: "請選擇三角形", revealed: false };
  userState[q.id] = {
    selected: cur.selected,
    slot1: q.correctSlot1 || cur.slot1,
    slot2: q.correctSlot2 || cur.slot2,
    revealed: true
  };
  saveProgress();
  renderPracticeStage();
}

function resetCurrentStep() {
  const q = QUESTIONS_5_2[currentStepIndex];
  delete userState[q.id];
  saveProgress();
  renderPracticeStage();
}

function jumpToStep(idx) {
  currentStepIndex = idx;
  showOrigImage = false;
  renderPracticeStage();
}

function prevStep() {
  if (currentStepIndex > 0) {
    currentStepIndex--;
    showOrigImage = false;
    renderPracticeStage();
  }
}

function nextStep() {
  if (currentStepIndex < QUESTIONS_5_2.length - 1) {
    currentStepIndex++;
    showOrigImage = false;
    renderPracticeStage();
  }
}

function toggleOriginalImage() {
  showOrigImage = !showOrigImage;
  renderPracticeStage();
}

// ============================================================================
// 7. 類題動態隨機出題器（讓學生可以換數字反覆練習！）
// ============================================================================
function generateNewNumbersForPractice() {
  const q = QUESTIONS_5_2[currentStepIndex];
  if (q.type !== "practice") return;

  if (q.id === "P1") {
    const angles = [45, 52, 65, 68, 70, 74];
    const newAng = angles[Math.floor(Math.random() * angles.length)];
    q.diagramData.angleVal = newAng;
    q.concept = `1. 圖中頂點 <b>D</b> 和頂點 <b>F</b> 都是 <b>${newAng}°</b>，因此 <b>∠D 和 ∠F</b> 一樣大。<br>2. 有兩個角一樣大的三角形，對面的兩條腰等長，所以它是<b>等腰三角形</b>！`;
  } else if (q.id === "P2") {
    const baseAngles = [50, 58, 62, 65, 68, 72];
    const legLens = [42, 48, 56, 64, 75];
    const baseLens = [26, 30, 35, 40];
    const newAng = baseAngles[Math.floor(Math.random() * baseAngles.length)];
    const newLeg = legLens[Math.floor(Math.random() * legLens.length)];
    const newBase = baseLens[Math.floor(Math.random() * baseLens.length)];

    q.diagramData.baseAngle = newAng;
    q.diagramData.legLen = newLeg;
    q.diagramData.baseLen = newBase;
    q.options = [
      `${newBase} 公分`,
      `${newLeg} 公分`,
      `${newAng} 公分`,
      `${newLeg - 9} 公分`
    ];
    q.answer = 1;
    q.concept = `1. 圖中 ∠Q = ${newAng}°、∠R = ${newAng}°，兩個底角相等，因此三角形 PQR 是<b>等腰三角形</b>。<br>2. 左右兩側的<b>邊 PQ</b> 和<b>邊 PR</b> 是等長的兩腰。已知邊 PR = ${newLeg} 公分，所以<b>邊 PQ = ${newLeg} 公分</b>！`;
  } else if (q.id === "P3") {
    const isoLeg = [5, 6, 7, 8, 10][Math.floor(Math.random() * 5)];
    const isoBase = isoLeg + 3;
    const isFirstIso = Math.random() > 0.5;

    if (isFirstIso) {
      q.visualCards = [
        { num: "(1)", name: "甲", svgType: "inverted_iso", topLen: isoBase, leftLen: isoLeg, rightLen: isoLeg, fill: "#fde68a" },
        { num: "(2)", name: "乙", svgType: "right_scalene", leftLen: isoLeg, bottomLen: isoLeg + 2, hypLen: isoLeg + 1, fill: "#d9f99d" }
      ];
      q.options = [
        `甲（邊長 ${isoBase} 公分、${isoLeg} 公分、${isoLeg} 公分）`,
        `乙（邊長 ${isoLeg} 公分、${isoLeg + 1} 公分、${isoLeg + 2} 公分）`
      ];
      q.answer = 0;
      q.concept = `<b>(1) 甲三角形</b>有兩條邊都是 <b>${isoLeg} 公分（一樣長）</b>，所以<b>甲是等腰三角形</b>！`;
    } else {
      q.visualCards = [
        { num: "(1)", name: "甲", svgType: "right_scalene", leftLen: isoLeg, bottomLen: isoLeg + 2, hypLen: isoLeg + 1, fill: "#d9f99d" },
        { num: "(2)", name: "乙", svgType: "inverted_iso", topLen: isoBase, leftLen: isoLeg, rightLen: isoLeg, fill: "#fde68a" }
      ];
      q.options = [
        `甲（邊長 ${isoLeg} 公分、${isoLeg + 1} 公分、${isoLeg + 2} 公分）`,
        `乙（邊長 ${isoBase} 公分、${isoLeg} 公分、${isoLeg} 公分）`
      ];
      q.answer = 1;
      q.concept = `<b>(2) 乙三角形</b>有兩條邊都是 <b>${isoLeg} 公分（一樣長）</b>，所以<b>乙是等腰三角形</b>！`;
    }
  }

  delete userState[q.id];
  saveProgress();
  renderPracticeStage();
}

// ============================================================================
// 8. 平板與投影專用：互動手寫畫筆（Canvas）與工具列
// ============================================================================
const canvas = document.getElementById("draw-canvas");
const ctx = canvas.getContext("2d");
let drawing = false;

function resizeCanvas() {
  const panel = document.getElementById("stage-card");
  if (!panel) return;
  const rect = panel.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
}

function toggleDrawMode() {
  isDrawingMode = !isDrawingMode;
  document.getElementById("btn-toggle-draw").classList.toggle("active", isDrawingMode);
  document.getElementById("draw-canvas").classList.toggle("drawing-active", isDrawingMode);
  document.getElementById("draw-toolbar").classList.toggle("show", isDrawingMode);
  resizeCanvas();
}

function setPenColor(color, el) {
  penColor = color;
  document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
  if (el) el.classList.add("active");
}

function clearCanvas() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

canvas.addEventListener("pointerdown", (e) => {
  if (!isDrawingMode) return;
  drawing = true;
  const rect = canvas.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener("pointermove", (e) => {
  if (!drawing || !isDrawingMode) return;
  const rect = canvas.getBoundingClientRect();
  ctx.lineWidth = 4.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = penColor;
  ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.stroke();
});

window.addEventListener("pointerup", () => {
  drawing = false;
});

window.addEventListener("resize", resizeCanvas);

// 字級縮放與全螢幕
function adjustFontSize(delta) {
  if (delta === 0) fontScale = 1;
  else fontScale = Math.min(1.35, Math.max(0.85, fontScale + delta));
  document.documentElement.style.setProperty("--font-scale", fontScale.toFixed(2));
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// 鍵盤快捷鍵支援
document.addEventListener("keydown", (e) => {
  const practiceVisible = document.getElementById("practice-view").style.display === "block";
  if (!practiceVisible) return;

  const tag = (document.activeElement && document.activeElement.tagName || "").toUpperCase();
  if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;

  if (e.key === "ArrowRight") {
    e.preventDefault();
    nextStep();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevStep();
  } else if (["1", "2", "3", "4"].includes(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const q = QUESTIONS_5_2[currentStepIndex];
    if (q && idx < q.options.length) {
      e.preventDefault();
      selectOption(idx);
    }
  } else if (e.key === " ") {
    e.preventDefault();
    revealCurrentAnswer();
  }
});

// ============================================================================
// 9. URL 參數直達初始化
// ============================================================================
function applyInitialQueryParams() {
  const params = new URLSearchParams(window.location.search);
  const unitParam = (params.get("unit") || "").toUpperCase();
  const subParam = (params.get("sub") || "").trim();

  if (unitParam && CURRICULUM.some(u => u.unitId === unitParam)) {
    CURRICULUM.forEach(u => {
      u.expandedByDefault = (u.unitId === unitParam);
    });
  }

  renderTOC();

  if (subParam) {
    for (const u of CURRICULUM) {
      if (unitParam && u.unitId !== unitParam) continue;
      const matched = u.subsections.find(s => s.code === subParam || s.altCode === subParam);
      if (matched && matched.ready) {
        openPracticeUnit(matched.code);
        return;
      }
    }
  }

  if (unitParam && unitParam !== "U6") {
    const unitEl = document.getElementById(`unit-${unitParam}`);
    if (unitEl) {
      setTimeout(() => unitEl.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
    }
  }
}

// 初始化
loadProgress();
applyInitialQueryParams();
</script>
